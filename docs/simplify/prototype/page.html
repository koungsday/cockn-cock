<title>콕콕콕 단순화 시안</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 짜임: 휴대폰은 한 줄 화면과 아래 글자 탭, 넓은 화면은 왼쪽 메뉴와 가운데 한 줄(최대 720px). 시안 설정은 앱 밖 맨 위 띠.
   색은 중립 바탕 + 짙은 초록 하나(주요 버튼·켜짐). 메뉴는 지금 실사용과 같은 어두운 바탕에 연두 알약. 글자는 네 단계(22·18·16·14)와 굵기 둘(400·600). 한 가지 밝은 모습만 쓴다(제품이 밝은 화면 하나). */
@font-face { font-family: "Wanted Sans UI"; src: url("fonts/WantedSansUI-v1.0.3.woff2") format("woff2"); font-weight: 400 1000; font-display: swap; }
@font-face { font-family: "Nexen Tire"; src: url("fonts/NexenTire-Regular-2014.ttf") format("truetype"); font-weight: 400; font-display: swap; }
:root {
  color-scheme: light;
  --bg: #f5f5f2; --surface: #ffffff; --ink: #1d2421; --sub: #5a635e; --line: #e3e4df; --edge: #b4bbb5;
  --accent: #10483a; --accent-hover: #0a372c; --accent-soft: #e8f0eb; --on: #ffffff; --danger: #a3312f; --lab: #e9e9e4; --hover: #eeefeb;
  --menu: #252c29; --menu-ink: #d3d9d4; --menu-on: #eef1ee; --menu-hover: #2f3733; --menu-line: #3a433e; --lime: #d0f988;

  --font-name: "Nexen Tire", var(--font);
  --t1: 22px; --t2: 18px; --t3: 16px; --t4: 14px;
  --ease: cubic-bezier(.22, 1, .36, 1); --quick: 160ms; --arrive: 220ms;
  --side-l: max(16px, env(safe-area-inset-left, 0px)); --side-r: max(16px, env(safe-area-inset-right, 0px));
}
* { box-sizing: border-box; }

button, input, select, textarea { font: inherit; color: inherit; }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.t1 { font-size: var(--t1); line-height: 1.3; font-weight: 600; letter-spacing: -.01em; text-wrap: balance; }
.t2 { font-size: var(--t2); line-height: 1.4; font-weight: 600; }
.sub { color: var(--sub); font-size: var(--t4); line-height: 1.45; }

/* 시안 설정: 앱 밖 */
.lab { background: var(--lab); border-bottom: 1px solid var(--line); font-size: var(--t4); color: var(--sub); }

.seg button { border: 0; background: transparent; min-height: 44px; padding: 0 14px; font-size: var(--t4); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--on); }

/* 틀: 지금 실사용과 같은 모습 (어두운 왼쪽 메뉴, 휴대폰은 떠 있는 어두운 아이콘 바와 연두 알약, 오른쪽 위 메뉴 버튼) */
.side { display: none; }

.icon-btn + .icon-btn { margin-left: 6px; }
.back { display: inline-flex; align-items: center; gap: 4px; min-height: 44px; margin-left: -6px; padding: 0 10px 0 6px; border: 0; border-radius: 10px; background: transparent; font-size: var(--t3); transition: background-color var(--quick); }
.main { max-width: 760px; margin: 0 auto; padding: 20px var(--side-r) calc(112px + env(safe-area-inset-bottom, 0px)) var(--side-l); outline: none; }
.tabs { position: fixed; z-index: 6; inset: auto max(12px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; max-width: 420px; margin-inline: auto; padding: 6px; border-radius: 16px; background: var(--menu); box-shadow: 0 12px 30px #1b2a2138, 0 2px 8px #1b2a211f; }
.tab { position: relative; z-index: 1; display: grid; place-items: center; min-height: 48px; border: 0; border-radius: 11px; background: transparent; color: var(--menu-ink); transition: background-color var(--quick), color var(--quick); }

.tab-mark { position: absolute; inset-block: 6px; left: 6px; width: calc((100% - 24px) / 4); border-radius: 11px; background: var(--lime); translate: calc(var(--at, 0) * (100% + 4px)) 0; }
.side .brand, .drawer .brand { display: flex; align-items: center; gap: 8px; padding: 4px 12px 16px; color: var(--menu-on); font-family: var(--font-name); font-size: var(--t2); }

.side .tab, .drawer .tab { grid-auto-flow: column; justify-content: start; gap: 10px; width: 100%; min-height: 48px; padding: 0 12px; font-size: var(--t3); }
.side .tab[aria-current="page"], .drawer .tab[aria-current="page"] { background: var(--menu-line); color: var(--menu-on); font-weight: 600; }
.drawer { width: min(86vw, 360px); height: 100%; max-height: none; margin: 0 0 0 auto; padding: calc(14px + env(safe-area-inset-top, 0px)) 12px 20px; border: 0; background: var(--menu); color: var(--menu-ink); }

}
@media (hover: hover) {

  .drawer .icon-btn:hover { background: var(--menu-hover); }
}

/* 부품 */

.mine { margin-top: 8px; font-weight: 600; }

.choice[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-soft); }

.check input { appearance: none; display: inline-grid; place-items: center; flex: none; width: 24px; height: 24px; margin: 0; border: 2px solid var(--edge); border-radius: 50%; background: var(--surface); cursor: pointer; transition: background-color var(--arrive) var(--ease), border-color var(--quick); }
.check input::after { content: ""; width: 6px; height: 11px; margin-top: -2px; border: solid var(--on); border-width: 0 2.5px 2.5px 0; rotate: 45deg; opacity: 0; transition: opacity var(--quick); }
.check input[type="radio"]::after { width: 8px; height: 8px; margin: 0; border: 0; border-radius: 50%; background: var(--on); rotate: none; }
.check input:checked { border-color: var(--accent); background: var(--accent); }
.check input:checked::after { opacity: 1; }
.status { min-height: 22px; margin-top: 10px; color: var(--accent); font-size: var(--t4); font-weight: 600; }
.status.err { color: var(--danger); }
.field { display: grid; gap: 6px; margin-top: 16px; }
.field label, .field > span { color: var(--sub); font-size: var(--t4); }
.field input, .field select, .field textarea { width: 100%; min-height: 52px; padding: 10px 12px; border: 1px solid var(--edge); border-radius: 10px; background: var(--surface); font-size: var(--t3); }
.field textarea { min-height: 140px; resize: vertical; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.kinds .choice { min-height: 48px; font-size: var(--t3); }
.inline { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; margin-top: 12px; }
.inline input { min-height: 52px; padding: 10px 12px; border: 1px solid var(--edge); border-radius: 10px; background: var(--surface); }
.inline .btn { width: auto; }
.att .ck { display: grid; place-items: center; flex: none; width: 36px; height: 36px; border: 2px solid var(--edge); border-radius: 50%; color: transparent; transition: background-color var(--quick), border-color var(--quick), scale var(--quick) var(--ease); }

@media (min-width: 900px) {
  .foot { bottom: 0; margin-inline: 0; padding-inline: 16px; border: 1px solid var(--line); border-radius: 10px; }
  .btn-row { grid-template-columns: repeat(auto-fit, minmax(0, 240px)); }

}
@media (prefers-reduced-motion: no-preference) {
  .main.push > * { animation: come var(--arrive) var(--ease) backwards; --from: 16px 0; }

</style>

  let toastTimer, lastMark = -1;
  const tabButton = current => ([id, text, glyph]) => `<button type="button" class="tab" data-act="tab" data-arg="${id}" data-key="tab-${id}" title="${text}"${current === id ? ' aria-current="page"' : ''}>${icon(glyph, 22)}<span>${text}</span></button>`;
  const brand = () => `<div class="brand"><img src="shuttlecock-icon-96.png" alt="" width="26" height="26">${CLUB}</div>`;
  function render(dir = '') {
    const v = view(), tabs = TABS[state.role], current = state.tab[state.role];
    const key = dir ? null : document.activeElement?.dataset?.key;
    const mark = tabs.slice(0, 4).findIndex(([id]) => id === current);
    app.innerHTML = `<nav class="side" aria-label="메뉴"><div class="side-in">${brand()}${tabs.map(tabButton(current)).join('')}</div></nav>
      <div class="col"><header class="bar"><div class="bar-in">${v.back ? `<button type="button" class="back" data-act="back" data-key="back">${icon('back', 20)}<span>뒤로</span></button>` : ''}<div class="crumb">${v.back ? '' : `<span>${CLUB}</span><span>/</span>`}<h1>${v.title}</h1></div>${v.action ?? ''}<button type="button" class="icon-btn m-only" data-act="menu" data-key="menu" aria-label="메뉴 열기">${icon('menu')}</button></div></header>
      <main class="main ${dir}" id="main" tabindex="-1">${v.body}</main></div>
      <nav class="tabs" aria-label="바로가기"${mark >= 0 && lastMark >= 0 && lastMark !== mark ? ' data-slide' : ''} style="--at:${Math.max(mark, 0)};--was:${Math.max(lastMark, 0)}">${mark >= 0 ? '<span class="tab-mark"></span>' : ''}${tabs.slice(0, 4).map(tabButton(current)).join('')}</nav>${state.flash ? `<div class="toast" role="status">${esc(state.flash)}</div>` : ''}`;
    lastMark = mark;
    if (dir && dir !== 'enter') { window.scrollTo(0, 0); document.getElementById('main').focus({ preventScroll: true }); }
    else if (key) [...app.querySelectorAll('[data-key]')].find(el => el.dataset.key === key && el.offsetParent)?.focus({ preventScroll: true });
    for (const b of document.querySelectorAll('[data-lab]')) b.setAttribute('aria-pressed', String(String(state[b.dataset.lab]) === b.dataset.v));
    document.getElementById('lab-now').textContent = `${state.role === 'organizer' ? '운영진' : '회원'} · ${{ before: '전날', today: '당일', after: '끝난 뒤' }[state.moment]}`;
  }
  // 휴대폰의 전체 메뉴: 오른쪽에서 들어오는 서랍. ×, 바깥, Esc로 닫힌다.
  const drawer = document.getElementById('drawer');
  function openMenu() {
    const account = state.role === 'member' && !state.signedIn ? `<button type="button" class="tab" data-act="open" data-arg="login:">${icon('user', 22)}<span>로그인</span></button>` : `<button type="button" class="tab" data-act="logout">${icon('back', 22)}<span>로그아웃</span></button>`;
    drawer.innerHTML = `<div class="drawer-head">${brand()}<button type="button" class="icon-btn" data-act="menu-close" aria-label="메뉴 닫기">${icon('x')}</button></div><div class="drawer-list">${TABS[state.role].map(tabButton(state.tab[state.role])).join('')}${account}</div>`;
    drawer.showModal();
  }
  drawer.addEventListener('click', ev => {
    const el = ev.target.closest('[data-act]');
    if (ev.target === drawer || el) drawer.close();
    if (el && el.dataset.act !== 'menu-close') acts[el.dataset.act]?.(el.dataset.arg ?? '', el);
  });
  function toast(text) {
    state.flash = text; clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { state.flash = ''; app.querySelector('.toast')?.remove(); }, 3500);
  }
  const say = (text, err = false) => { state.msg = text; state.err = err; };
  const clear = () => { state.msg = ''; state.err = false; state.confirm = ''; state.report = ''; state.temp = ''; state.guestOpen = false; state.form = {}; state.vals = {}; };
  // A form error is said in place: nothing is redrawn, and the first empty field takes the focus.
  function fail(form, text) {
    const line = form.querySelector('.status') ?? form.parentElement.querySelector('.status');
    if (line) { line.textContent = text; line.classList.add('err'); }
    [...form.querySelectorAll('input:not([type="checkbox"]):not([type="radio"]), textarea')].find(el => !el.value.trim())?.focus();
  }
  function go(name, id, tab) { clear(); if (name === 'event') state.eventTab = tab || ''; if (name === 'login') state.login = { step: 1, name: '' }; state.stack.push({ name, id: id || '' }); render('push'); }
  function back() { clear(); state.stack.pop(); render('pop'); }
  function copy(text, done) {
    const ok = () => { toast(done); render(); }, fail = () => { toast('복사하지 못했어요. 글을 길게 눌러 복사해 주세요.'); render(); };
    try { navigator.clipboard.writeText(text).then(ok, fail); } catch { fail(); }
  }
  const val = (form, id) => form.querySelector('#' + id)?.value.trim() ?? '';

  const acts = {
    tab(arg) {
      const order = TABS[state.role].map(([id]) => id), was = order.indexOf(state.tab[state.role]), deep = state.stack.length;
      clear(); state.stack = []; state.tab[state.role] = arg;
      render(order.indexOf(arg) > was ? 'push' : order.indexOf(arg) < was || deep ? 'pop' : '');
    },
    menu: () => openMenu(),
    open(arg) { const [name, id, tab] = arg.split(':'); go(name, id, tab); },
    back,
    toast(arg) { toast(arg); render(); },
    logout() { clear(); state.stack = []; state.role = 'member'; state.signedIn = false; toast('로그아웃했어요. 로그인 전 회원 화면이에요.'); render(); window.scrollTo(0, 0); },
    'cal-toggle'() { state.calendar = !state.calendar; state.calMonth = ''; render(); },
    cal(arg) { const [y, m] = (state.calMonth || today().slice(0, 7)).split('-').map(Number); const x = new Date(y, m - 1 + Number(arg), 1); state.calMonth = `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}`; render(); },
    slot(arg, el) {
      const [id, slot] = arg.split(':'), lunch = document.getElementById('lunch');
      state.draft[id].slot = slot; for (const b of app.querySelectorAll('[data-act="slot"]')) b.setAttribute('aria-pressed', String(b === el));
      // 불참이면 점심을 묻지 않는다.
      document.getElementById('lunch-row').hidden = slot === 'no'; if (slot === 'no') { state.draft[id].lunch = false; lunch.checked = false; }
      const line = app.querySelector('.status'); if (line) line.textContent = ''; say('');
    },
    lunch(arg, el) { state.draft[arg].lunch = el.checked; },
    'save-vote'(id) {
      const draft = state.draft[id];
      if (!draft.slot) { say('선발, 후발, 불참 중 하나를 골라 주세요.', true); return render(); }
      (votes[id] ??= {})[me()] = { slot: draft.slot, lunch: draft.lunch };
      say(`저장됐어요 · ${slotText(byId(id), votes[id][me()])}`); render();
    },
    'cancel-vote'(id) { delete votes[id][me()]; state.draft[id] = { slot: '', lunch: false }; say('응답을 취소했어요.'); render(); },
    copy(arg) { copy(`https://cockcockcock.pages.dev/clubs/suncok19/${arg.startsWith('n') ? 'notice' : 'vote'}/${arg}`, '링크를 복사했어요. 단체방에 붙여 넣으세요.'); },
    'event-tab'(arg) { clear(); state.eventTab = arg; render(); },
    publish(id) { const e = byId(id); e.published = !e.published; toast(e.published ? '회원에게 공개했어요.' : '공개를 내렸어요.'); render(); },
    close(id) { const e = byId(id); e.closed = !e.closed; toast(e.closed ? '투표를 닫았어요.' : '투표를 다시 열었어요.'); render(); },
    confirm(arg) { state.confirm = arg; render(); },
    'cancel-event'(id) { const e = byId(id); e.cancelled = !e.cancelled; state.confirm = ''; toast(e.cancelled ? '일정을 취소했어요.' : '취소를 풀었어요.'); render(); },
    att(arg, el) {
      const [id, who] = arg.split(':'); const a = attendance[id] ??= {}; a[who] = !a[who];
      el.setAttribute('aria-pressed', String(a[who])); const p = presentCount(id);
      document.getElementById('att-count').textContent = `출석 ${p.members + p.guests}명`;
    },
    'att-filter'() { state.onlyMissing = !state.onlyMissing; render(); },
    'guest-open'() { state.guestOpen = true; render(); document.getElementById('guest-name')?.focus(); },
    report(id) {
      const e = byId(id), p = presentCount(id), f = app.querySelector('form[data-form="wrap"]');
      state.report = `[${CLUB}] ${fmtDate(e.date)} ${e.title}\n출석 ${p.members + p.guests}명 (회원 ${p.members} · 게스트 ${p.guests})\n남은 콕 ${val(f, 'wrap-left') || 0}개 · 코트 찬조금 ${Number(val(f, 'wrap-fee') || 0).toLocaleString('ko-KR')}원\n오늘도 수고하셨습니다.`;
      render();
    },
    'copy-report'() { copy(state.report, '마무리 글을 복사했어요. 단체방에 붙여 넣으세요.'); },
    kind(arg, el) { state.form.kind = arg; for (const b of app.querySelectorAll('[data-act="kind"]')) b.setAttribute('aria-pressed', String(b === el)); },
    'pin-notice'(id) { const n = notices.find(x => x.id === id); n.pinned = !n.pinned; toast(n.pinned ? '맨 위에 고정했어요.' : '고정을 풀었어요.'); render(); },
    'del-notice'(id) { notices.splice(notices.findIndex(x => x.id === id), 1); clear(); state.stack.pop(); toast('공지를 지웠어요.'); render('pop'); },
    temp() { state.temp = '482913'; render(); },
  };
  const submits = {
    'login-name'(f) { const name = val(f, 'login-name'); if (!name) return fail(f, '성함을 적어 주세요.'); state.login = { step: 2, name }; say(''); render('push'); document.getElementById('login-code')?.focus(); },
    'login-code'(f) {
      if (!/^\d{6}$/.test(val(f, 'login-code'))) return fail(f, '숫자 6자리를 눌러 주세요.');
      state.signedIn = true; clear(); state.stack.pop(); toast('로그인했어요. 이 휴대폰에서는 6개월 동안 유지돼요.'); render('pop');
    },
    notice(f) {
      const title = val(f, 'notice-title'), body = val(f, 'notice-body');
      if (!title || !body) return fail(f, '제목과 내용을 모두 적어 주세요.');
      const n = notices.find(x => x.id === f.dataset.id);
      if (n) Object.assign(n, { title, body }); else notices.push({ id: 'n' + (notices.length + 4), title, body, date: today(), pinned: false });
      clear(); state.stack.pop(); toast(n ? '공지를 고쳤어요.' : '공지를 올렸어요.'); render('pop');
    },
    event(f) {
      const data = { title: val(f, 'ev-title'), kind: state.form.kind, date: val(f, 'ev-date'), time: val(f, 'ev-time'), end: val(f, 'ev-end'), place: val(f, 'ev-place'), deadline: val(f, 'ev-deadline'), early: val(f, 'ev-early'), late: val(f, 'ev-late'), notes: val(f, 'ev-notes') };
      if (!data.title || !data.date || !data.time || !data.place || !data.deadline) return fail(f, '이름, 날짜, 시작, 장소, 투표 마감을 채워 주세요.');
      const e = byId(f.dataset.id);
      if (!data.kind) delete data.kind;
      if (e) Object.assign(e, data); else { const id = 'e' + (events.length + 4); events.push({ id, kind: '정기', published: false, ...data }); votes[id] = {}; }
      clear(); state.stack.pop(); toast(e ? '일정을 고쳤어요.' : '일정을 만들었어요. 공개하면 회원에게 보여요.'); render('pop');
    },
    guest(f) { const name = val(f, 'guest-name'); if (!name) return fail(f, '게스트 이름을 적어 주세요.'); (guests[f.dataset.id] ??= []).push({ id: 'g' + Date.now(), name }); say(''); state.guestOpen = false; toast(`${name} 님을 게스트로 넣었어요.`); render(); },
    wrap(f) {
      if (!f.querySelector('#wrap-ok').checked) return fail(f, '집계를 확인했다는 표시를 먼저 눌러 주세요.');
      const e = byId(f.dataset.id); e.settled = true; e.present = presentCount(e.id).members;
      say(''); toast('마무리를 확정했어요.'); render();
    },
    member(f) {
      const m = members.find(x => x.id === f.dataset.id), name = val(f, 'mb-name');
      if (!name) return fail(f, '이름을 적어 주세요.');
      Object.assign(m, { name, active: f.querySelector('#mb-active').checked, organizer: f.querySelector('#mb-org').checked }); say('저장했어요.'); render();
    },
    'member-new'(f) {
      const name = val(f, 'nm-name');
      if (!name || !/^\d{6}$/.test(val(f, 'nm-birth'))) return fail(f, '이름과 생년월일 숫자 6자리를 적어 주세요.');
      members.push({ id: 'm' + members.length, name, organizer: false, active: true, marks: 0, rewarded: false });
      clear(); state.stack.pop(); toast(`${name} 님을 추가했어요.`); render('pop');
    },
    rules(f) {
      const goal = Number(val(f, 'rl-goal'));
      if (!(goal >= 1 && goal <= 20)) return fail(f, '구간 목표는 1회부터 20회까지예요.');
      Object.assign(rules, { periods: f.querySelector('#rl-periods').value, goal, kinds: [...f.querySelectorAll('[name="rl-kind"]:checked')].map(x => x.value), reward: f.querySelector('[name="rl-reward"]:checked').value });
      say('규칙을 저장했어요.'); render();
    },
  };
  app.addEventListener('click', ev => { const el = ev.target.closest('[data-act]'); if (el && acts[el.dataset.act]) acts[el.dataset.act](el.dataset.arg ?? '', el); });
  app.addEventListener('submit', ev => { ev.preventDefault(); submits[ev.target.dataset.form]?.(ev.target); });
  app.addEventListener('input', ev => {
    const list = ev.target.dataset.filter && document.getElementById(ev.target.dataset.filter);
    if (list) for (const li of list.children) li.hidden = !li.dataset.name.includes(ev.target.value.trim());
    else if (ev.target.id && !['checkbox', 'radio'].includes(ev.target.type)) state.vals[ev.target.id] = ev.target.value;
  });
  document.getElementById('lab').addEventListener('click', ev => {
    const b = ev.target.closest('[data-lab]'); if (!b) return;
    const key = b.dataset.lab, v = b.dataset.v;
    state[key] = key === 'signedIn' ? v === 'true' : v;
    if (key === 'signedIn') state.role = 'member';
    if (key !== 'menu') { clear(); state.stack = []; state.eventTab = ''; state.calMonth = ''; }
    if (key === 'moment' && v === 'after' && !Object.keys(attendance.e1 ?? {}).length) {
      attendance.e1 = {}; Object.keys(votes.e1).slice(0, 13).forEach(id => { attendance.e1[id] = true; }); attendance.e1.g0 = attendance.e1.g1 = true;
    }
    render();
  });
  render('enter');
})();
</script>
