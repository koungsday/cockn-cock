<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2f3f1">
  <meta name="robots" content="noindex, nofollow">
  <!-- share-meta -->
  <!-- club-context -->
  <!-- admin-app -->
  <title>콕콕콕!</title>
  <link rel="icon" type="image/png" sizes="96x96" href="/assets/shuttlecock-icon-96.png">
  <link rel="stylesheet" href="/live.css">
  <script type="module" src="/app.mjs"></script>
</head>
<body>
  <a class="skip-link" href="#main">본문 바로가기</a>
  <header class="site-header">
    <div class="header-inner">
      <nav class="club-navigation" aria-label="서비스와 모임">
        <a href="/" class="brand" aria-label="콕콕콕! 모임 목록">
          <img class="brand-mark" src="/assets/shuttlecock-icon-96.png" width="42" height="42" alt="">
        </a>
        <a id="club-home" class="current-club" hidden>
          <strong id="club-name"></strong>
          <small id="club-subtitle"></small>
        </a>
      </nav>
      <button type="button" id="login-menu" class="quiet login-menu-toggle" data-action="login-menu" aria-label="메뉴 열기" aria-haspopup="dialog" aria-controls="dialog" hidden>
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 8h16M4 16h16"/></svg>
      </button>
      <div id="account"></div>
    </div>
  </header>
  <main id="main" class="main" tabindex="-1">
    <p role="status">모임을 불러오는 중이에요.</p>
  </main>
  <div id="message" class="message" role="status" aria-live="polite" hidden></div>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  <noscript><p class="noscript">투표와 모임 운영 화면을 보려면 브라우저에서 자바스크립트를 켜 주세요.</p></noscript>
</body>
</html>
