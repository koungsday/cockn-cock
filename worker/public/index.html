<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f5ec">
  <meta name="robots" content="noindex, nofollow">
  <!-- share-meta -->
  <!-- club-context -->
  <title>콕콕콕!</title>
  <link rel="stylesheet" href="/live.css">
  <script type="module" src="/app.mjs"></script>
</head>
<body>
  <a class="skip-link" href="#main">본문 바로가기</a>
  <header class="site-header">
    <div class="header-inner">
      <nav class="club-navigation" aria-label="서비스와 모임">
        <a href="/" class="brand" aria-label="콕콕콕! 모임 목록">
          <span class="brand-mark" aria-hidden="true">콕</span>
          <strong>콕콕콕!</strong>
        </a>
        <a id="club-home" class="current-club" hidden>
          <strong id="club-name"></strong>
          <small id="club-subtitle"></small>
        </a>
      </nav>
      <div id="account"></div>
    </div>
  </header>
  <main id="main" class="main" tabindex="-1">
    <p role="status">모임을 불러오는 중이에요.</p>
  </main>
  <div id="message" class="message" role="status" aria-live="polite" hidden></div>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  <noscript><p class="noscript">투표와 모임 운영 화면을 보려면 브라우저에서 자바스크립트를 켜 주세요.</p></noscript>
</body>
</html>
