name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/configure-pages@v5
        id: pages
      - name: Build and verify the demo
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          test -n "$SITE_URL"
          npm run build
          npm run verify
          npm run live:test
          npm run live:build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
